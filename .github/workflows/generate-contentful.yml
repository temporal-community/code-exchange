name: Generate Contentful Description

on:
  issue_comment:
    types: [edited]

jobs:
  generate:
    # Fire when the approval checkbox in a ZiggyBot comment is checked.
    # Conditions:
    #   1. The comment was posted by github-actions[bot] (ZiggyBot)
    #   2. The new body has the checkbox checked
    #   3. The previous body had the checkbox unchecked (i.e. this edit just checked it)
    if: |
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '[x] Generate long description if needed') &&
      contains(github.event.changes.body.from, '[ ] Generate long description if needed')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Check editor is a Temporal employee
        id: check_team
        env:
          # Requires a token with org member-read (read:org). The default
          # GITHUB_TOKEN is repo-scoped and CANNOT read org team membership,
          # so a separate PAT/App secret (ORG_READ_TOKEN) is required.
          # Fails closed: any error -> not a member -> denied.
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          state=$(gh api "orgs/temporal-community/teams/temporal-employees/memberships/$SENDER" --jq '.state' 2>/dev/null || echo "none")
          if [ "$state" = "active" ]; then
            echo "is_member=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_member=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Contentful description
        if: steps.check_team.outputs.is_member == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/generate-contentful.mjs

      - name: Warn if not a Temporal employee
        if: steps.check_team.outputs.is_member != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "Only members of the Temporal Employees team can approve submissions for Contentful generation. @$SENDER is not a member of that team."
